<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none';">
<title>Runway</title>
<style>

/* ============ tokens ============ */
:root{--font-sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,"Helvetica Neue", Arial, sans-serif;--font-mono:ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono","Segoe UI Mono", Consolas, "Liberation Mono", monospace;--font-title:var(--font-sans);--surface:#FFFFFF;--surface-raised:#F7F8FA;--border:#E3E6EB;--fg:#12141A;--fg-muted:#5B6472;--accent:#4F46E5;--accent-soft:color-mix(in srgb, var(--accent) 12%, var(--surface));--calm-text:#15803D;--calm-bar:#16A34A;--calm-tint:#F0FDF4;--soon-text:#854D0E;--soon-bar:#AD7A02;--soon-tint:#FEFCE8;--near-text:#9A3412;--near-bar:#EA580C;--near-tint:#FFF7ED;--due-text:#B91C1C;--due-bar:#DC2626;--due-tint:#FEF2F2;--seg-empty:#E3E6EB;--dirty:#B45309;--err:#B91C1C;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--row-h:44px;--radius:6px;--dur-add:180ms;--dur-done:220ms;--dur-gauge:120ms;--dur-toast:150ms;--shadow:0 8px 30px rgba(0,0,0,.14);--scrim:rgba(15,17,21,.4);--seg-radius:1px;--bevel:none;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="geocities"]){--surface:#0F1115;--surface-raised:#171A21;--border:#252A34;--fg:#E6E8EC;--fg-muted:#9AA3B2;--calm-text:#4ADE80;--calm-bar:#22C55E;--calm-tint:rgba(34,197,94,.10);--soon-text:#FACC15;--soon-bar:#EAB308;--soon-tint:rgba(234,179,8,.10);--near-text:#FB923C;--near-bar:#F97316;--near-tint:rgba(249,115,22,.12);--due-text:#F87171;--due-bar:#EF4444;--due-tint:rgba(239,68,68,.12);--seg-empty:#252A34;--dirty:#FACC15;--err:#F87171;--shadow:0 8px 30px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{--surface:#0F1115;--surface-raised:#171A21;--border:#252A34;--fg:#E6E8EC;--fg-muted:#9AA3B2;--calm-text:#4ADE80;--calm-bar:#22C55E;--calm-tint:rgba(34,197,94,.10);--soon-text:#FACC15;--soon-bar:#EAB308;--soon-tint:rgba(234,179,8,.10);--near-text:#FB923C;--near-bar:#F97316;--near-tint:rgba(249,115,22,.12);--due-text:#F87171;--due-bar:#EF4444;--due-tint:rgba(239,68,68,.12);--seg-empty:#252A34;--dirty:#FACC15;--err:#F87171;--shadow:0 8px 30px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);}
:root[data-theme="geocities"]{--surface:#000080;--surface-raised:#000066;--border:#C0C0C0;--fg:#FFFFFF;--fg-muted:#C0C0C0;--accent:#00FFFF;--accent-soft:#000066;--calm-text:#00FF00;--calm-bar:#00FF00;--calm-tint:rgba(0,255,0,.12);--soon-text:#FFFF00;--soon-bar:#FFFF00;--soon-tint:rgba(255,255,0,.12);--near-text:#FFA500;--near-bar:#FFA500;--near-tint:rgba(255,165,0,.12);--due-text:#FF5555;--due-bar:#FF0000;--due-tint:rgba(255,0,0,.15);--seg-empty:#404090;--dirty:#FFFF00;--err:#FF5555;--radius:0;--seg-radius:0;--font-title:"Comic Sans MS","Comic Sans","Chalkboard SE",cursive;--font-sans:"Times New Roman",Times,serif;--scrim:rgba(0,0,32,.6);--shadow:0 0 0 2px #000;}
/* ============ reset ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline-offset:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ============ layout ============ */
body{background:var(--surface);color:var(--fg);font:14px/1.45 var(--font-sans)}
.app{max-width:880px;margin:0 auto;padding:0 var(--sp-4) 80px;container-type:inline-size;container-name:app;min-height:100%}
/* header */
.hdr{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)}
.app-title{font:600 15px/1 var(--font-title);letter-spacing:-0.01em}
.app-ver{margin-right:auto;font:400 11px var(--font-mono);color:var(--fg-muted);opacity:.65;align-self:center}
.hdr-btn{display:inline-flex;align-items:center;gap:6px;min-width:32px;min-height:32px;justify-content:center;padding:4px 8px;border-radius:var(--radius);color:var(--fg-muted);font:500 12px var(--font-mono)}
.hdr-btn:hover{background:var(--surface-raised);color:var(--fg)}
.hdr-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.hdr-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;font:500 12px var(--font-mono);color:var(--fg)}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.warn,.pill.warn:hover{border-color:var(--dirty);color:var(--dirty)}
.pill.err,.pill.err:hover{border-color:var(--err);color:var(--err)}
.pill.warn:hover,.pill.err:hover{background:var(--surface-raised)}
.pill .g:empty{display:none}
@container app (max-width:560px){#fileChip .lbl{display:none}
#fileChip .g{min-width:14px}
}
.save-ind{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 6px;font:400 12px var(--font-mono);color:var(--fg-muted)}
.save-ind .dot{width:7px;height:7px;border-radius:50%;background:var(--fg-muted);opacity:.4}
.save-ind.dirty .dot{background:var(--dirty);opacity:1}
.save-ind.saving .dot{background:var(--dirty);opacity:1;animation:pulse 1s ease-in-out infinite}
.save-ind.error .dot{background:var(--err);opacity:1}
@keyframes pulse{50%{opacity:.3}
}
/* banners */
#banners{display:flex;flex-direction:column;gap:var(--sp-2)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);font-size:13px}
.banner.warn{border-color:var(--dirty)}
.banner.alert{border-color:var(--due-bar)}
.banner .msg{flex:1;min-width:200px}
.banner button{padding:4px 10px;min-height:28px;border:1px solid var(--border);border-radius:var(--radius);font:500 12px var(--font-mono)}
.banner button:hover{border-color:var(--accent);color:var(--accent)}
.banner .bx{border:none;color:var(--fg-muted);min-width:32px;min-height:32px}
.banner pre{width:100%;max-height:260px;overflow:auto;font:12px/1.5 var(--font-mono);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-2);margin-top:var(--sp-1)}
.banner pre .da{color:var(--calm-text)}
.banner pre .dr{color:var(--due-text);text-decoration:line-through}
/* filter bar: tag chips, search field, counts */
.filterbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tagkey{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.filterbar .counts{font:400 11px var(--font-mono);color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.filterbar .counts.filt{color:var(--fg)}
.tkchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px;border:1px solid var(--border);border-radius:var(--radius);font:500 11px var(--font-mono);color:var(--fg)}
.tkchip .k{color:var(--fg-muted)}
.tkchip:hover{border-color:var(--accent)}
.tkchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tkchip[aria-pressed="true"] .k{color:#fff;opacity:.75}
.tkchip:disabled{opacity:.4;cursor:default}
.tkchip:disabled:hover{border-color:var(--border)}
@container app (max-width:560px){.tkchip .lbl{display:none}
.tkchip{gap:0}
}
/* entry row */
.entry{display:flex;gap:var(--sp-2);margin-top:var(--sp-4)}
.entry input{flex:1 1 72%;min-width:0;padding:10px var(--sp-3);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--fg)}
.entry input::placeholder{color:var(--fg-muted);opacity:.8}
.entry #dateInput{flex:0 1 28%;min-width:110px;font-family:var(--font-mono);font-size:13px}
.entry input.bad,.title-edit.bad,.sub-edit.bad{border-color:var(--due-bar)}
@container app (max-width:560px){.entry{flex-direction:column}
.entry #dateInput{flex-basis:auto;width:100%}
}
.entry-chips{display:flex;gap:4px;margin-top:4px;min-height:0}
.date-preview{padding:4px 2px 0;font:400 12px var(--font-mono);color:var(--fg-muted);min-height:22px;font-variant-numeric:tabular-nums;text-align:right}
.date-preview.rolled{color:var(--accent)}
.date-preview.past,.date-preview.invalid{color:var(--due-text)}
@container app (max-width:560px){.date-preview{text-align:left}
}
/* search (lives in the filter bar, right of the tag chips) */
.search{display:flex;align-items:center;gap:6px;flex:1 1 200px;min-width:160px;max-width:320px;min-height:32px;margin-left:auto;padding:0 10px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius)}
.search svg{width:14px;height:14px;stroke:var(--fg-muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:none;background:none;padding:6px 0;font:400 12px var(--font-mono);color:var(--fg)}
.search input::placeholder{color:var(--fg-muted);opacity:.8}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.search .hk{flex:none;font:500 10px/16px var(--font-mono);color:var(--fg-muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--surface)}
.search.hasq .hk,.search:focus-within .hk{display:none}
.search .clr{color:var(--fg-muted);min-width:28px;min-height:32px;display:none}
.search.hasq .clr{display:inline-flex;align-items:center;justify-content:center}
.count-line{font:400 11px var(--font-mono);color:var(--fg-muted);padding:var(--sp-1) 2px;font-variant-numeric:tabular-nums}
/* digest */
.digest{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-radius:var(--radius);font:400 12px var(--font-mono);color:var(--fg-muted)}
.digest b{color:var(--due-text);font-weight:600}
/* sections */
.sect{margin-top:var(--sp-4)}
.sect-h{display:flex;align-items:baseline;gap:var(--sp-2);font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);padding-bottom:var(--sp-1);border-bottom:1px solid var(--border)}
.sect-h .n{font-weight:400;font-variant-numeric:tabular-nums}
/* task rows */
.task{display:grid;grid-template:"g c main meta" auto "g c sub sub" auto / 20px 24px minmax(0,1fr) auto;align-items:center;column-gap:var(--sp-2);min-height:var(--row-h);padding:var(--sp-1) var(--sp-2) var(--sp-1) 0;border-bottom:1px solid var(--border);position:relative}
[data-density="compact"] .task{min-height:34px;padding-top:0;padding-bottom:0}
.task.u-overdue{border-left:3px solid var(--due-bar);margin-left:-3px}
.task.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.task.adding{animation:rowin var(--dur-add) ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-8px)}
}
.task.collapsing{transition:height var(--dur-done) ease-in,opacity var(--dur-done) ease-in;opacity:0;overflow:hidden;border-bottom-width:0;min-height:0}
.gauge{grid-area:g;width:8px;height:26px;display:flex;flex-direction:column-reverse;gap:2px;justify-self:center}
.gauge i{flex:1;background:var(--seg-empty);border-radius:var(--seg-radius);transition:background var(--dur-gauge)}
.gauge i.f{background:var(--u-bar,var(--seg-empty))}
.task{--u-bar:var(--seg-empty);--u-text:var(--fg-muted)}
.u-calm{--u-bar:var(--calm-bar);--u-text:var(--calm-text);--u-tint:var(--calm-tint)}
.u-soon{--u-bar:var(--soon-bar);--u-text:var(--soon-text);--u-tint:var(--soon-tint)}
.u-near{--u-bar:var(--near-bar);--u-text:var(--near-text);--u-tint:var(--near-tint)}
.u-due,.u-overdue{--u-bar:var(--due-bar);--u-text:var(--due-text);--u-tint:var(--due-tint)}
.task .cb{grid-area:c;width:16px;height:16px;justify-self:center;accent-color:var(--accent);cursor:pointer}
.tmain{grid-area:main;display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
@container app (max-width:560px){.task{grid-template:"g c main" auto "g c meta" auto "g c sub" auto / 20px 24px minmax(0,1fr)}
.title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tmeta{justify-self:start;font-size:12px;padding-bottom:2px}
}
.title-edit{width:100%;background:var(--surface-raised);border:1px solid var(--accent);border-radius:var(--radius);padding:4px 8px;font-size:14px}
.note-toggle{color:var(--fg-muted);font:400 11px var(--font-mono);min-width:32px;min-height:24px;display:inline-flex;align-items:center;gap:2px;flex:none}
.note-toggle:hover{color:var(--fg)}
.tmeta{grid-area:meta;display:flex;align-items:center;gap:var(--sp-2);justify-self:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-radius:var(--radius);font:500 11px var(--font-mono);color:var(--fg-muted);background:var(--surface-raised)}
.pri{font:600 12px var(--font-mono);color:var(--fg-muted);letter-spacing:1px}
.pri.p3{color:var(--fg)}
.datechip{font:500 12px var(--font-mono);color:var(--u-text);cursor:pointer;padding:2px 4px;border-radius:var(--radius)}
.datechip:hover{background:var(--surface-raised)}
.datechip.undated{color:var(--fg-muted);opacity:.6}
.date-edit{width:150px;background:var(--surface-raised);border:1px solid var(--accent);border-radius:var(--radius);padding:2px 6px;font:400 12px var(--font-mono)}
.rowactions{display:inline-flex;gap:2px;visibility:hidden}
.task:hover .rowactions,.task.sel .rowactions,.task:focus-within .rowactions{visibility:visible}
.rowactions button{min-width:28px;min-height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--fg-muted)}
.rowactions button:hover{background:var(--surface-raised);color:var(--fg)}
.rowactions svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.subwrap{grid-area:sub;padding:2px 0 4px}
.notetext{font:400 13px var(--font-sans);color:var(--fg-muted);white-space:pre-wrap}
.notetext.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtasks{margin-top:2px}
.subtasks li{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:13px;color:var(--fg)}
.subtasks input[type=checkbox]{width:13px;height:13px;accent-color:var(--accent);flex:none}
.subtasks .sdone{color:var(--fg-muted);text-decoration:line-through}
.subtasks .stext{cursor:text;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtasks .datechip{font-size:11px;padding:1px 4px;flex:none}
.subactions{display:inline-flex;gap:2px;visibility:hidden;margin-left:auto}
.subtasks li:hover .subactions,.subtasks li:focus-within .subactions{visibility:visible}
.subactions button{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--fg-muted)}
.subactions button:hover{background:var(--surface-raised);color:var(--fg)}
.subactions button:disabled{opacity:.3;cursor:default}
.subactions button:disabled:hover{background:none;color:var(--fg-muted)}
.subactions svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
@media (hover:none){.rowactions,.subactions{visibility:visible}
}
.sub-edit{flex:1;min-width:0;background:var(--surface-raised);border:1px solid var(--accent);border-radius:var(--radius);padding:2px 6px;font-size:13px}
.sub-add{display:block;width:100%;max-width:340px;margin-top:4px;padding:4px 8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--fg)}
.sub-add::placeholder{color:var(--fg-muted);opacity:.7}
.note-toggle.sub-drives{color:var(--u-text);font-weight:600}
.task.done .title{color:var(--fg-muted);text-decoration:line-through}
.donechip{font:400 12px var(--font-mono);color:var(--fg-muted)}
/* view switcher */
.view-seg button{min-width:34px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-muted)}
.view-seg button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
/* runway timeline */
.tl{margin-top:var(--sp-4)}
.tl-h{display:flex;align-items:baseline;gap:var(--sp-2)}
.tl-toggle{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);min-height:24px}
.tl-toggle:hover{color:var(--fg)}
.tl-sum{font:400 11px var(--font-mono);color:var(--fg-muted);font-variant-numeric:tabular-nums}
.tl-body{margin-top:var(--sp-1)}
.tl-scale{display:flex;align-items:flex-end;gap:1px;height:64px;border-bottom:1px solid var(--border);overflow-x:auto}
.tl-day{flex:1 1 0;min-width:9px;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;height:100%;padding-bottom:3px}
.tl-day.late{flex:0 0 34px;background:var(--due-tint);border-right:1px solid var(--border)}
.tl-day.today{background:var(--accent-soft)}
.tl-day.nonwork{background:var(--surface-raised)}
.tl-day.wk{border-left:1px solid var(--border)}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--u-bar,var(--seg-empty));padding:0;flex:none;transition:transform var(--dur-gauge)}
.tl-dot:hover,.tl-dot:focus-visible{transform:scale(1.5)}
.tl-more{font:400 9px var(--font-mono);color:var(--fg-muted)}
.tl-ax{display:flex;justify-content:space-between;font:400 10px var(--font-mono);color:var(--fg-muted);padding-top:2px}
/* board view */
.board{display:flex;gap:var(--sp-2);margin-top:var(--sp-4);overflow-x:auto;align-items:stretch;padding-bottom:var(--sp-2);scroll-snap-type:x proximity;scrollbar-width:thin}
.board::-webkit-scrollbar{height:8px}
.board::-webkit-scrollbar-thumb{background:var(--seg-empty);border-radius:4px}
.bcol{flex:1 1 0;min-width:176px;max-width:320px;display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-2);scroll-snap-align:start;max-height:72vh;max-height:72dvh;transition:min-width .15s ease}
.bcol .sect-h{flex:none}
.bcol.dropover{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}
.bcol-list{flex:1;min-height:72px;display:flex;flex-direction:column;gap:var(--sp-2);padding-top:var(--sp-2);overflow-y:auto;scrollbar-width:thin}
.bcol.empty{flex:0 0 34px;min-width:34px;padding:var(--sp-2) 0}
.bcol.empty .sect-h{writing-mode:vertical-rl;border-bottom:none;padding:var(--sp-1) 0 0;align-self:center}
.bcol.empty .sect-h .n{display:none}
.bcol.empty .bcol-list{display:none}
.board.drag .bcol.empty:not([data-col="overdue"]){flex:1 1 0;min-width:176px;padding:var(--sp-2)}
.board.drag .bcol.empty:not([data-col="overdue"]) .sect-h{writing-mode:horizontal-tb;border-bottom:1px solid var(--border);padding:0 0 var(--sp-1);align-self:auto}
.board.drag .bcol.empty:not([data-col="overdue"]) .sect-h .n{display:inline}
.board.drag .bcol.empty:not([data-col="overdue"]) .bcol-list{display:flex}
.bcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--u-bar,var(--seg-empty));border-radius:var(--radius);padding:var(--sp-2);cursor:grab;flex:none}
.bcard:hover{border-color:var(--fg-muted);border-left-color:var(--u-bar,var(--seg-empty))}
.bcard.dragging{opacity:.5;cursor:grabbing}
.bcard.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.bcard-top{display:flex;align-items:flex-start;gap:var(--sp-2)}
.bcard-top .cb{width:15px;height:15px;accent-color:var(--accent);flex:none;margin-top:2px}
.bcard .title{font-size:13px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:text;min-width:0}
.bcard-meta{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;margin-top:var(--sp-1);padding-left:23px;font-variant-numeric:tabular-nums}
.bcol-empty{color:var(--fg-muted);text-align:center;padding:var(--sp-3) 0;border:1px dashed var(--border);border-radius:var(--radius);font-size:12px}
@container app (max-width:560px){.bcol{flex:0 0 236px;min-width:236px;max-width:none}
.bcol.empty{flex:0 0 34px;min-width:34px}
.board{scroll-snap-type:x mandatory}
}
/* calendar view */
.cal{margin-top:var(--sp-4)}
.cal-h{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.cal-title{font:600 14px var(--font-title);min-width:150px;text-align:center}
.cal-nav{min-width:32px;min-height:32px;border:1px solid var(--border);border-radius:var(--radius);color:var(--fg)}
.cal-nav:hover{border-color:var(--accent);color:var(--accent)}
.cal-h .mini-btn{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:var(--surface-raised);font:600 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);text-align:center;padding:4px 0}
.cal-day{background:var(--surface);min-height:78px;padding:2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-day.nonwork{background:var(--surface-raised)}
.cal-day.out .cal-num{opacity:.35}
.cal-day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-num{align-self:flex-start;font:500 11px var(--font-mono);color:var(--fg-muted);min-width:22px;min-height:20px;border-radius:var(--radius);padding:1px 4px}
.cal-num:hover{background:var(--accent-soft);color:var(--accent)}
.cal-chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.cchip{display:block;width:100%;text-align:left;font:400 10px var(--font-mono);color:var(--u-text,var(--fg-muted));background:var(--u-tint,var(--surface-raised));border:1px solid var(--u-bar,var(--seg-empty));border-radius:3px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cchip-more{font:400 10px var(--font-mono);color:var(--fg-muted);text-align:left;padding:0 4px}
.cchip-more:hover{color:var(--fg)}
@container app (max-width:560px){.cal-day{min-height:54px}
.cchip{width:9px;height:9px;border-radius:50%;padding:0;border-width:2px}
.cchip .t{display:none}
}
/* empty states */
.empty{padding:40px 0;text-align:center;color:var(--fg-muted);font-size:13px}
.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
/* snooze popover */
.pop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-2);min-width:230px}
.pop h3{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);padding:2px 6px 6px}
.pop button{display:flex;width:100%;align-items:center;gap:var(--sp-2);padding:6px 8px;min-height:32px;border-radius:var(--radius);font-size:13px;text-align:left}
.pop button:hover,.pop button.hot{background:var(--surface-raised)}
.pop .kk{font:500 11px var(--font-mono);color:var(--fg-muted);width:14px}
.pop .dd{margin-left:auto;font:400 12px var(--font-mono);color:var(--fg-muted)}
/* toasts */
#toasts{position:fixed;left:var(--sp-4);bottom:var(--sp-4);z-index:60;display:flex;flex-direction:column;gap:var(--sp-2);max-width:360px}
.toast{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-2) var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);font-size:13px;overflow:hidden;animation:toastin var(--dur-toast) ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(6px)}
}
.toast .tmsg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .tundo{color:var(--accent);font:600 12px var(--font-mono);min-height:32px;padding:0 6px}
.toast .tk{font:400 11px var(--font-mono);color:var(--fg-muted)}
.toast .drain{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:100%}
/* overlays:settings + shortcuts */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80}
.panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;z-index:81;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel.full{width:100%;border-left:none}
.panel-h{display:flex;align-items:center;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)}
.panel-h h2{font:600 13px var(--font-title)}
.panel-h .px{margin-left:auto;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-muted);border-radius:var(--radius)}
.panel-h .px:hover{background:var(--surface-raised);color:var(--fg)}
.panel-b{flex:1;overflow-y:auto;padding:var(--sp-2) var(--sp-4) var(--sp-6)}
.set-sect{margin-top:var(--sp-4)}
.set-sect>h3{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);padding-bottom:var(--sp-1);border-bottom:1px solid var(--border)}
.set-row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;flex-wrap:wrap}
.set-row>label:first-child,.set-row>.slbl{flex:1 0 120px;font-size:13px}
.set-row .hint{flex-basis:100%;font-size:12px;color:var(--fg-muted)}
.set-row select,.set-row input[type=text],.set-row input[type=number]{padding:5px 8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);font:400 13px var(--font-mono);color:var(--fg);max-width:160px}
.set-row input[type=number]{width:70px}
.set-row input.bad{border-color:var(--due-bar)}
.set-err{flex-basis:100%;color:var(--due-text);font-size:12px}
.seg-btns{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.seg-btns button{padding:5px 10px;min-height:32px;font:500 12px var(--font-mono);color:var(--fg-muted)}
.seg-btns button+button{border-left:1px solid var(--border)}
.seg-btns button[aria-pressed="true"]{background:var(--accent);color:#fff}
.accent-row{display:flex;gap:6px;flex-wrap:wrap}
.accent-sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.accent-sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.accent-row.disabled .accent-sw{opacity:.35;pointer-events:none}
.ramp-preview{display:flex;gap:var(--sp-3);padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--radius);margin-top:var(--sp-1);font:400 11px var(--font-mono);color:var(--fg-muted);flex-wrap:wrap}
.ramp-preview .rp{display:flex;align-items:center;gap:6px}
.ramp-preview .g{display:flex;flex-direction:column-reverse;gap:1px;width:6px;height:18px}
.ramp-preview .g i{flex:1;background:var(--seg-empty);border-radius:var(--seg-radius)}
.tagmap-table{width:100%;border-collapse:collapse;margin-top:var(--sp-1)}
.tagmap-table td{padding:3px 4px}
.tagmap-table input{width:100%;padding:4px 8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);font:400 13px var(--font-mono);color:var(--fg)}
.tagmap-table td:first-child{width:56px}
.tagmap-table td:last-child{width:36px}
.mini-btn{padding:5px 10px;min-height:32px;border:1px solid var(--border);border-radius:var(--radius);font:500 12px var(--font-mono);color:var(--fg)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.danger:hover{border-color:var(--due-bar);color:var(--due-text)}
.mono-sample{font:400 12px var(--font-mono);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-2);margin-top:var(--sp-1);overflow-x:auto;white-space:pre}
.backup-list{max-height:200px;overflow-y:auto;width:100%}
.backup-list button{display:flex;width:100%;gap:var(--sp-2);padding:6px 8px;min-height:32px;border-radius:var(--radius);font:400 12px var(--font-mono);text-align:left}
.backup-list button:hover{background:var(--surface-raised)}
.backup-list .bn{margin-left:auto;color:var(--fg-muted)}
/* stats panel */
.stat-kv{display:flex;align-items:baseline;gap:var(--sp-2);padding:5px 0;font-size:13px;border-bottom:1px solid var(--border)}
.stat-kv .k{color:var(--fg-muted);flex:1}
.stat-kv .v{font:500 13px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.stat-kv .v.bad{color:var(--due-text)}
.stat-kv .v.warn{color:var(--dirty)}
.stat-cap{font:400 11px var(--font-mono);color:var(--fg-muted);margin-top:var(--sp-3)}
.stat-bars{display:flex;align-items:flex-end;gap:2px;height:48px;margin-top:var(--sp-1)}
.stat-bars i{flex:1;min-height:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.55}
.stat-bars i.cur{opacity:1}
.stat-bars i.nw{opacity:.3}
.stat-bars i.heavy{background:var(--due-bar);opacity:1}
.stat-lbls{display:flex;justify-content:space-between;font:400 10px var(--font-mono);color:var(--fg-muted);padding-top:2px}
/* shortcut overlay */
.shortcuts{position:fixed;z-index:81;top:50%;left:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));max-height:80vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-4)}
.shortcuts h2{font:600 13px var(--font-title);margin-bottom:var(--sp-2)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-4)}
.sc-grid h3{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:var(--sp-1)}
.sc-grid dl{display:grid;grid-template-columns:auto 1fr;gap:3px var(--sp-3);font-size:13px}
.sc-grid dt{font:500 12px var(--font-mono);color:var(--fg);background:var(--surface-raised);border:1px solid var(--border);border-radius:4px;padding:0 6px;text-align:center;min-width:28px;justify-self:start;align-self:start}
.sc-grid dd{color:var(--fg-muted)}
/* help dialog: a tabbed page inside the shortcuts box */
.shortcuts.help{width:min(760px,calc(100vw - 32px));max-height:min(86vh,760px);padding:0;overflow:hidden;display:flex;flex-direction:column}
.help-h{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);flex:none}
.help-h h2{margin:0}
.help-h .hv{font:400 11px var(--font-mono);color:var(--fg-muted);opacity:.65}
.help-h .px{margin-left:auto;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-muted);border-radius:var(--radius)}
.help-h .px:hover{background:var(--surface-raised);color:var(--fg)}
.help-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:var(--sp-2) var(--sp-4) 0;border-bottom:1px solid var(--border);flex:none}
.help-tabs [role="tab"]{padding:6px 10px;min-height:32px;font:500 12px var(--font-mono);color:var(--fg-muted);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:var(--radius) var(--radius) 0 0}
.help-tabs [role="tab"]:hover{color:var(--fg);background:var(--surface-raised)}
.help-tabs [role="tab"][aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.help-b{flex:1;min-height:0;overflow-y:auto;padding:var(--sp-2) var(--sp-4) var(--sp-4);font-size:13px;line-height:1.5}
.help-b h3{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin:var(--sp-4) 0 var(--sp-1);padding-bottom:var(--sp-1);border-bottom:1px solid var(--border)}
.help-b>h3:first-child{margin-top:var(--sp-2)}
.help-b p{margin:var(--sp-2) 0}
.help-b p.muted{color:var(--fg-muted);font-size:12px}
.help-b code,.help-b kbd{font:500 12px var(--font-mono);color:var(--fg);background:var(--surface-raised);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.help-b kbd{border-bottom-width:2px;white-space:nowrap}
.help-steps{margin:var(--sp-3) 0;display:grid;gap:var(--sp-3);counter-reset:step}
.help-steps li{display:grid;grid-template-columns:24px 1fr;column-gap:var(--sp-3)}
.help-steps li::before{counter-increment:step;content:counter(step);width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font:600 12px/24px var(--font-mono);text-align:center}
.help-steps li b{display:block;font-weight:600}
.help-steps li span{grid-column:2;color:var(--fg-muted)}
.help-table{width:100%;border-collapse:collapse;margin:var(--sp-1) 0 var(--sp-2)}
.help-table td{padding:6px 10px 6px 0;border-bottom:1px solid var(--border);vertical-align:top}
.help-table td:first-child{width:1%;white-space:nowrap}
.help-table td:first-child code{margin-right:4px}
.help-table td:first-child b{font-weight:600}
.help-table td:last-child{color:var(--fg-muted)}
.help-note{margin:var(--sp-3) 0;padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface-raised);font-size:12.5px}
.help-status{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-radius:var(--radius)}
.help-status .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--calm-bar)}
.help-status.warn .dot{background:var(--dirty)}
.help-status .txt{flex:1 1 240px}
.help-status .help-actions{flex-basis:100%;margin:0}
.help-actions{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-2) 0}
.help-ramp{display:flex;flex-wrap:wrap;gap:6px;margin:var(--sp-2) 0}
.help-ramp span{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:var(--radius);font:500 11px var(--font-mono)}
.help-ramp i{width:6px;height:12px;border-radius:var(--seg-radius)}
.help-ramp .u-calm{color:var(--calm-text);background:var(--calm-tint)}
.help-ramp .u-calm i{background:var(--calm-bar)}
.help-ramp .u-soon{color:var(--soon-text);background:var(--soon-tint)}
.help-ramp .u-soon i{background:var(--soon-bar)}
.help-ramp .u-near{color:var(--near-text);background:var(--near-tint)}
.help-ramp .u-near i{background:var(--near-bar)}
.help-ramp .u-due,.help-ramp .u-overdue{color:var(--due-text);background:var(--due-tint)}
.help-ramp .u-due i,.help-ramp .u-overdue i{background:var(--due-bar)}
.help-ramp .u-overdue{border-left:3px solid var(--due-bar)}
.help-nextrow{display:flex;justify-content:flex-end;margin-top:var(--sp-4)}
.help-next{padding:6px 10px;min-height:32px;border:1px solid var(--border);border-radius:var(--radius);font:500 12px var(--font-mono);color:var(--accent)}
.help-next:hover{border-color:var(--accent);background:var(--accent-soft)}
.help-b .sc-grid{margin-top:var(--sp-2)}
.help-b .sc-grid h3{border:none;margin:0 0 var(--sp-1);padding:0}
.help-b .mono-sample{font-size:11.5px;line-height:1.5}
@media (max-width:560px){.shortcuts.help{top:0;left:0;transform:none;width:100vw;height:100%;max-height:100%;border-radius:0;border:none}
.help-table tr{display:block;padding:5px 0;border-bottom:1px solid var(--border)}
.help-table td{display:block;width:auto;border:none;padding:2px 0;white-space:normal}
.help-table td:first-child code{white-space:normal;margin-bottom:2px}
}
/* completed section */
.comp-group h4{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin-top:var(--sp-3)}
/* test panel */
#testpanel{position:fixed;right:var(--sp-4);bottom:var(--sp-4);z-index:90;width:min(480px,90vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-3);font:12px/1.6 var(--font-mono)}
#testpanel .pass{color:var(--calm-text)}
#testpanel .fail{color:var(--due-text)}
/* ============ GeoCities decoration layer ============ */

[data-theme="geocities"] .bcol{border:2px inset #C0C0C0;border-radius:0}
[data-theme="geocities"] .hdr-btn:hover,[data-theme="geocities"] .pill:hover,[data-theme="geocities"] .mini-btn:hover{color:#000080;background:#C0C0C0}
[data-theme="geocities"] .hdr-btn:active,[data-theme="geocities"] .pill:active,[data-theme="geocities"] .tkchip:active,[data-theme="geocities"] .mini-btn:active,[data-theme="geocities"] .tkchip[aria-pressed="true"],[data-theme="geocities"] .seg-btns button[aria-pressed="true"]{border-style:inset;background:#000066;color:#00FFFF}
[data-theme="geocities"] .tkchip .k{color:#000080}
[data-theme="geocities"] .tkchip[aria-pressed="true"] .k{color:#00FFFF}
[data-theme="geocities"] .entry input,[data-theme="geocities"] .search,[data-theme="geocities"] .set-row select,[data-theme="geocities"] .set-row input,[data-theme="geocities"] .title-edit,[data-theme="geocities"] .date-edit,[data-theme="geocities"] .tagmap-table input{border:2px inset #C0C0C0;border-radius:0;background:#000066;color:#FFF}
[data-theme="geocities"] .gauge{width:10px;gap:1px}
[data-theme="geocities"] .gauge i{border:1px outset #C0C0C0;background:#111}
[data-theme="geocities"] .gauge i.f{background:var(--u-bar);border-style:inset}
[data-theme="geocities"] .sect-h{border-bottom:none;padding-bottom:0}
[data-theme="geocities"] .sect-h::after{content:"";flex:1;height:4px;align-self:center;background:repeating-linear-gradient(90deg,#FF0000 0 12px,#FFA500 12px 24px,#FFFF00 24px 36px,#00FF00 36px 48px,#00FFFF 48px 60px,#FF00FF 60px 72px)}
[data-theme="geocities"] #completedToggle{font-family:var(--font-mono);background:#000;color:#00FF00;border:2px inset #C0C0C0;letter-spacing:2px;text-shadow:0 0 3px #00FF00}
[data-theme="geocities"] .save-ind.dirty,[data-theme="geocities"] .save-ind.saving{background:repeating-linear-gradient(45deg,#FFFF00 0 6px,#000 6px 12px);border:1px solid #000;padding:2px 8px}
[data-theme="geocities"] .save-ind.dirty .txt,[data-theme="geocities"] .save-ind.saving .txt{color:#000;background:#FFFF00;padding:0 4px;font-weight:700}
[data-theme="geocities"] .save-ind.saving .txt{animation:geoblink 1s steps(2,jump-none) 3}

}
[data-theme="geocities"] .app-title{font-size:18px;color:#00FFFF;animation:geomarquee 6s linear 1}

to{transform:none}
